<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoldPulse · Live gold prices, drivers & tools</title>
  <meta name="description" content="GoldPulse: live gold prices in any currency, an interactive dashboard, why gold moved today, fair value model, fear & greed index, news, Turkish gold prices and tools.">
  <meta name="theme-color" content="#0f0e0c">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    try { var th = JSON.parse(localStorage.getItem('gp_theme')); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <a class="logo" href="#/dashboard" aria-label="GoldPulse home">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f6d77a"/><stop offset="1" stop-color="#b8861f"/></linearGradient></defs><circle cx="16" cy="16" r="15" fill="url(#lg)"/><path d="M5 18h5l2.5-6 4 11 3-8 2 3H27" fill="none" stroke="#1a1408" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Gold<b>Pulse</b></span>
      </a>
      <div id="ticker" class="ticker" aria-live="polite"></div>
      <div id="controls" class="controls"></div>
    </div>
    <nav id="nav" class="nav"></nav>
  </header>
  <main id="app" class="page"></main>
  <footer id="foot" class="foot"></footer>

  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
